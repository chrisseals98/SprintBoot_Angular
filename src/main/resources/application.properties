spring.application.name=demo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/demo
# spring.jpa.show-sql: true
# logging.level.org.springframework.security.oauth2=DEBUG

spring.security.oauth2.client.registration.github.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=user

docusign.api.account-id=${DOC_ACCOUNT_ID}
docusign.template-id=${DOC_TEMPLATE_ID}
docusign.basepath=${DOC_API_URL}
docusign.integration-key=${DOC_INT_KEY}
docusign.user-id=${DOC_USER_ID}
docusign.scopes=signature
docusign.token.expiration=3600